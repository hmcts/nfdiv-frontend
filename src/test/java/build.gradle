plugins {
    id 'application'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

// tag::repositories[]
repositories {
  def pipelineEnvironments = [
    'preview', 'aat', 'prod', 'demo', 'perftest', 'ithc'
  ]

  if (!(System.getenv('ENVIRONMENT') in pipelineEnvironments)) {
    mavenLocal()
    mavenCentral()
    maven {
      url 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
    }
  } else {
    def sandbox = System.getenv('NONPROD_SUBSCRIPTION_NAME') in ['sandbox', 'sbox']
    def host = sandbox
      ? 'artifactory.sandbox.platform.hmcts.net'
      : 'artifactory.platform.hmcts.net'

    maven {
      url = "https://${host}/artifactory/maven-remotes"
    }
  }
}
// end::repositories[]

// tag::dependencies[]
dependencies {
    testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.36'
    testImplementation group: 'com.github.hmcts', name: 'fortify-client', version: '1.4.9', classifier: 'all'
}
// end::dependencies[]

task fortifyScan(type: JavaExec)  {
    mainClass = "uk.gov.hmcts.fortifyclient.FortifyClientMainApp"
    classpath += sourceSets.test.runtimeClasspath
    jvmArgs = ['--add-opens=java.base/java.lang.reflect=ALL-UNNAMED']
}
